# Rebuilds FAINTR's data from the latest PvPoke and publishes the website to Cloudflare Pages.
# Runs every night at midnight Central, when you push code to main, and when an admin presses
# "Update data now" on the website (that calls this through the Supabase function trigger-update).
name: FAINTR site update

on:
  schedule:
    - cron: "0 5 * * *" # midnight Central in daylight time (CDT, March to November)
    - cron: "0 6 * * *" # midnight Central in standard time (CST, November to March)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild every format even if PvPoke didn't change
        type: choice
        options: ["false", "true"]
        default: "false"
      formats:
        description: Only these formats, comma separated (e.g. all-1500,fantasy-1500). Empty means all.
        required: false
        default: ""
      requested_by:
        description: Who asked (filled in by the website)
        required: false
        default: ""

concurrency:
  group: faintr-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # GitHub's schedule is in UTC, so two times are listed; only the one that is midnight in Chicago today runs.
      - name: Check it's midnight Central
        id: gate
        env:
          REQ_BY: ${{ inputs.requested_by }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "Cloudflare settings aren't configured; publication cannot continue."
            echo "### Setup required" >> "$GITHUB_STEP_SUMMARY"
            echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            off=$(TZ=America/Chicago date +%z)
            if { [ "${{ github.event.schedule }}" = "0 5 * * *" ] && [ "$off" != "-0500" ]; } || \
               { [ "${{ github.event.schedule }}" = "0 6 * * *" ] && [ "$off" != "-0600" ]; }; then
              echo "Not midnight in Chicago for this schedule; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ -n "$REQ_BY" ]; then printf 'Requested from the website by %s\n' "$REQ_BY"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      # Last run's PvPoke copy and team data, so only formats that changed are rebuilt
      - name: Restore built data
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .webcache
          key: faintr-webcache-${{ github.run_id }}
          restore-keys: faintr-webcache-

      - name: Check hosting access
        if: steps.gate.outputs.skip != 'true'
        id: hosting
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          (async () => {
            const token = (process.env.CF_TOKEN || '').trim().replace(/^Bearer\s+/i, '');
            const account = (process.env.CF_ACCOUNT || '').trim();
            if (!token || !/^[0-9a-f]{32}$/.test(account)) throw new Error('Check the saved Cloudflare token and account ID.');
            console.log('::add-mask::' + token);
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects`, {headers:{Authorization:`Bearer ${token}`}});
            if (!response.ok) throw new Error(`Cloudflare rejected the deployment credential (HTTP ${response.status}). Replace CLOUDFLARE_API_TOKEN with an API token that can edit Pages in this account.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `token=${token}\naccount=${account}\n`);
            console.log('Hosting access verified.');
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Build the site
        if: steps.gate.outputs.skip != 'true'
        env:
          FAINTR_DISCORD_URL: ${{ vars.FAINTR_DISCORD_URL }}
          FAINTR_PATREON_URL: ${{ vars.FAINTR_PATREON_URL }}
          FAINTR_SUPPORT_URL: ${{ vars.FAINTR_SUPPORT_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          FAINTR_LOGIN_PROVIDERS: ${{ vars.FAINTR_LOGIN_PROVIDERS }}
          FAINTR_BILLING_ENABLED: ${{ vars.FAINTR_BILLING_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          FORMATS: ${{ inputs.formats }}
        run: |
          # Inputs arrive as environment variables and are checked, never pasted into the script
          if ! [[ "$FORMATS" =~ ^[a-z0-9,-]*$ ]]; then echo "formats may only hold format keys like all-1500,fantasy-1500"; exit 1; fi
          args=(--fetch)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$FORMATS" ]; then args+=(--formats "$FORMATS"); fi
          node tools/build_web.js "${args[@]}"

      - name: Verify team sharing
        if: steps.gate.outputs.skip != 'true'
        run: |
          node tools/test-sharing.cjs
          node --test tools/operations-alerts.test.cjs

      - name: Install release-check browsers
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        run: |
          # The runner's Azure Ubuntu mirror can stall on browser dependencies.
          # Use Ubuntu's primary mirror and bounded network retries instead.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'http://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99faintr-timeouts > /dev/null
          npx playwright install --with-deps chromium webkit

      - name: Check desktop, mobile and Safari before publishing
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        run: npx playwright test --workers=2

      - name: Save release-check report
        if: failure() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-check-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Save built data
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: .webcache
          key: faintr-webcache-${{ github.run_id }}

      # First run only: makes the Cloudflare Pages project (later runs just see it exists)
      - name: Make the Cloudflare Pages project
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.hosting.outputs.token }}
          accountId: ${{ steps.hosting.outputs.account }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT || 'faintr' }} --production-branch=main

      - name: Publish to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.hosting.outputs.token }}
          accountId: ${{ steps.hosting.outputs.account }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT || 'faintr' }} --branch=main --commit-dirty=true

      # A free Supabase project pauses after a week with no activity; this keeps it awake
      - name: Keep Supabase awake
        if: steps.gate.outputs.skip != 'true' && vars.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/site_status?select=id" -H "apikey: $SUPABASE_ANON_KEY" > /dev/null || echo "Supabase didn't answer (it may be paused; open the Supabase dashboard to restore it)."
