name: FAINTR database backup
on:
  schedule:
    - cron: '17 9 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/postgres-client
      - name: Create encrypted recovery archive
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python3 tools/database-backup.py backup faintr.dump.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: faintr-db-${{ github.run_id }}
          path: faintr.dump.gpg
          if-no-files-found: error
          retention-days: 35
  recovery:
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: faintr_restore
          POSTGRES_PASSWORD: offline-restore-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/postgres-client
      - uses: actions/download-artifact@v4
        with:
          name: faintr-db-${{ github.run_id }}
          path: recovery
      - name: Decrypt and rehearse recovery in isolated database
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: python3 tools/database-backup.py restore recovery/faintr.dump.gpg
      - name: Recovery result
        run: echo 'Encrypted artifact downloaded, decrypted and restored. All archived table data matched; privacy rules and relationships present. No production writes. OAuth and outbound email are not exercised.' >> "$GITHUB_STEP_SUMMARY"
