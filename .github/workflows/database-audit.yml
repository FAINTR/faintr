name: FAINTR isolated database checks
on:
  push:
    branches: [main]
    paths: ['supabase/**/*.sql', 'tools/database-audit.test.cjs', '.github/workflows/database-audit.yml']
  pull_request:
    paths: ['supabase/**/*.sql', 'tools/database-audit.test.cjs', '.github/workflows/database-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "${{ runner.temp }}/faintr-db-audit" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.11
      - name: Verify policies and proposed SQL without production access
        env:
          FAINTR_PGLITE_MODULE: ${{ runner.temp }}/faintr-db-audit/node_modules/@electric-sql/pglite
        run: node --test tools/database-audit.test.cjs
