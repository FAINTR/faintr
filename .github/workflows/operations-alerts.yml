name: FAINTR operations alerts
on:
  workflow_run:
    workflows: ['FAINTR site update', 'FAINTR database backup', 'Discord daily Top 10']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: operations-alert-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # No checkout, artifacts, workflow logs or user-supplied code are executed.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const failure = ['failure', 'timed_out', 'action_required', 'startup_failure'].includes(run.conclusion);
            if (!failure && run.conclusion !== 'success') return;
            if (!failure) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo,run_id:run.id,filter:'latest',per_page:100});
              const completed = ['Publish to Cloudflare Pages','Post current published league teams','Decrypt and rehearse recovery in isolated database'];
              if (!jobs.some(j=>j.steps?.some(s=>completed.includes(s.name) && s.conclusion==='success'))) return;
            }
            const marker = `<!-- faintr-operations:${run.workflow_id} -->`;
            const repo = context.repo;
            // A rerun or delayed completion must not resolve a newer failure.
            const {data: recent} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: run.workflow_id, branch:'main', per_page:10});
            const newer = recent.workflow_runs.some(r=>r.run_number > run.run_number && r.status === 'completed' && ['success','failure','timed_out','action_required','startup_failure'].includes(r.conclusion));
            if (newer) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...repo,state:'open',creator:'github-actions[bot]',per_page:100});
            const existing = issues.find(i=>!i.pull_request && i.body?.includes(marker));
            if (failure) {
              const body = `${marker}\nFAINTR needs attention: **${run.name}** failed.\n\n[Open the failed run](${run.html_url}). Review the failed step, fix it, and rerun the workflow.\n\nThis issue closes after a successful run. No credentials or customer data are included.`;
              if (existing) await github.rest.issues.update({...repo,issue_number:existing.number,body});
              else await github.rest.issues.create({...repo,title:`Action needed: ${run.name}`,body,assignees:[repo.owner]});
            } else if (existing) {
              await github.rest.issues.createComment({...repo,issue_number:existing.number,body:`Recovered: [successful run](${run.html_url}).`});
              await github.rest.issues.update({...repo,issue_number:existing.number,state:'closed'});
            }
