name: Configure short team links
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faintr-short-link-setup
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare public team lookup and private creation credential
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'faintr' }}
        run: node tools/configure-short-links.cjs
      - name: Verify short links and access rules with real database roles
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/verify_short_links.sql
